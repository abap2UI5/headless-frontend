name: ABAP_UNIT

# The ABAP Unit tests of this repository on abap2UI5's transpiled Node
# runtime (SQLite behind the database statements, so the DANGEROUS class
# runs too) - `npm run unit`, the same .github/scripts/unit.mjs a developer
# runs. The framework is not built here: it comes transpiled, with its
# sources, as the npm package @abap2ui5/node-runtime (a devDependency), and
# the script transpiles this repository's src/ with it.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ABAP_UNIT-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ABAP_UNIT:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    # open-abap-core and express-icf-shim at the commits the package records
    # (its transpile fetches them, a folder per commit) - the lockfile decides
    # the package, so it is the key. After `npm ci`, which empties
    # node_modules
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules/.cache/abap2ui5-node-runtime/open-abap-core
          node_modules/.cache/abap2ui5-node-runtime/express-icf-shim
        key: unit-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - run: npm run unit
